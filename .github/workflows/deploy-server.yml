# 抓取中转有改动时，让服务器拉取最新代码并重启
name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'scraper.py'
      - 'requirements.txt'
      - 'static/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: server
      url: https://huarenjie.liyucheng.me
    steps:
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.HUARENJIE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HUARENJIE_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 服务器端为受限钥匙，只会执行 /usr/local/bin/deploy-huarenjie
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes ubuntu@151.80.60.57
